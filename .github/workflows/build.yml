name: Universal Multi-Framework Android APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. ស្វែងរក និង Extract ZIP File ដោយស្វ័យប្រវត្តិ
      - name: Extract ZIP File (if present)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "ZIP file detected. Extracting..."
            unzip -o *.zip -d temp_extract
            TARGET_FILE=$(find temp_extract \( -name "pubspec.yaml" -o -name "package.json" -o -name "index.html" \) | head -n 1)
            if [ -n "$TARGET_FILE" ]; then
              PROJECT_DIR=$(dirname "$TARGET_FILE")
              cp -r "$PROJECT_DIR"/* .
              rm -rf temp_extract
            else
              cp -r temp_extract/* .
              rm -rf temp_extract
            fi
          fi

      # 2. ដំឡើង Environment ទាំងអស់ (Java 17, Node 20, Flutter, Package Managers)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Corepack & Bun
        run: |
          npm install -g corepack bun || true
          corepack enable || true

      # 3. ពិនិត្យ និង Build តាមប្រភេទ Project ដោយស្វ័យប្រវត្តិ
      - name: Auto Detect Project and Build APK
        run: |
          echo "=========================================="
          echo "   Detecting Project Type & Building...   "
          echo "=========================================="
          
          # លុប APK ចាស់ៗដែលប្រហែលជាជាប់ក្នុង Source Code ចោលមុននឹង Build
          find . -name "*.apk" -type f -delete
          
          # --- ករណីទី ១៖ FLUTTER PROJECT ---
          if [ -f "pubspec.yaml" ]; then
            echo "==> Flutter Project Detected."
            flutter pub get
            flutter build apk --release

          # --- ករណីទី ២៖ NODE / REACT / REACT NATIVE PROJECT ---
          elif [ -f "package.json" ]; then
            echo "==> Node/React Project Detected."
            
            if [ -f "pnpm-lock.yaml" ]; then
              pnpm install --no-frozen-lockfile || npm install --legacy-peer-deps
            elif [ -f "yarn.lock" ]; then
              yarn install || npm install --legacy-peer-deps
            elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
              bun install || npm install --legacy-peer-deps
            else
              npm install --legacy-peer-deps
            fi

            if grep -q '"react-native"' package.json || grep -q '"expo"' package.json; then
              echo "==> React Native / Expo Project Detected."
              
              rm -rf android/.cxx android/app/.cxx || true
              
              if [ ! -d "android" ]; then
                echo "Generating Android native code..."
                npm install expo --legacy-peer-deps || true
                npx expo prebuild --platform android --clean || true
              fi

              if [ -d "android" ]; then
                echo "==> Auto-fixing Package Name / Namespace mismatch & BuildConfig..."
                
                # 1. ស្វែងរកឈ្មោះ Package ពីឯកសារ Kotlin/Java ផ្ទាល់
                MAIN_ACT=$(find android/app/src/main/java android/app/src/main/kotlin -name "MainActivity.kt" -o -name "MainActivity.java" 2>/dev/null | head -n 1)
                if [ -n "$MAIN_ACT" ]; then
                    PKG_NAME=$(grep -E '^package ' "$MAIN_ACT" | awk '{print $2}' | tr -d ';' | tr -d '\r')
                    echo "--> Detected exact package from code: $PKG_NAME"
                else
                    PKG_NAME="com.yourname.musicplayer"
                    echo "--> Using fallback package: $PKG_NAME"
                fi
                
                # 2. បញ្ចូល Namespace ដែលត្រឹមត្រូវ និង BuildConfig ទៅក្នុង build.gradle (Groovy DSL)
                APP_GRADLE="android/app/build.gradle"
                if [ -f "$APP_GRADLE" ]; then
                    if grep -q "namespace" "$APP_GRADLE"; then
                        sed -i -E "s/namespace\s+['\"].*['\"]/namespace '$PKG_NAME'/g" "$APP_GRADLE"
                    else
                        echo -e "\nandroid { namespace '$PKG_NAME' }" >> "$APP_GRADLE"
                    fi
                    echo -e "\nandroid { buildFeatures { buildConfig true } }" >> "$APP_GRADLE"
                fi

                # 3. បញ្ចូល Namespace សម្រាប់ Kotlin DSL (ប្រសិនបើមានប្រើ)
                APP_GRADLE_KTS="android/app/build.gradle.kts"
                if [ -f "$APP_GRADLE_KTS" ]; then
                    if grep -q "namespace" "$APP_GRADLE_KTS"; then
                        sed -i -E "s/namespace\s*=\s*[\"'].*[\"']/namespace = \"$PKG_NAME\"/g" "$APP_GRADLE_KTS"
                    else
                        echo -e "\nandroid { namespace = \"$PKG_NAME\" }" >> "$APP_GRADLE_KTS"
                    fi
                    echo -e "\nandroid { buildFeatures { buildConfig = true } }" >> "$APP_GRADLE_KTS"
                fi
                
                # 4. កំណត់ Global Properties
                echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
                echo "android.nonTransitiveRClass=false" >> android/gradle.properties
                echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
                echo "android.useAndroidX=true" >> android/gradle.properties
                echo "android.enableJetifier=true" >> android/gradle.properties
              fi

              cd android
              chmod +x gradlew
              ./gradlew clean
              
              echo -e "\nandroid { lintOptions { checkReleaseBuilds false; abortOnError false } }" >> app/build.gradle
              ./gradlew assembleRelease --no-daemon

            else
              echo "==> React/Web Project Detected. Converting Web to APK via Capacitor..."
              npm install @capacitor/core @capacitor/cli @capacitor/android typescript ts-node --legacy-peer-deps
              
              npm run build || npm run generate || true
              
              BUILD_DIR="dist"
              if [ -d "build" ]; then BUILD_DIR="build"; fi
              if [ -d "out" ]; then BUILD_DIR="out"; fi
              if [ -d "public" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then BUILD_DIR="public"; fi
              
              rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
              echo "{\"appId\": \"com.myapp.app\", \"appName\": \"My App\", \"webDir\": \"$BUILD_DIR\"}" > capacitor.config.json
              
              npx cap add android || true
              npx cap sync android
              
              if [ -d "android" ]; then
                echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
                echo "android.useAndroidX=true" >> android/gradle.properties
                echo "android.enableJetifier=true" >> android/gradle.properties
              fi

              cd android
              chmod +x gradlew
              ./gradlew clean
              ./gradlew assembleRelease --no-daemon
            fi

          # --- ករណីទី ៣៖ HTML/CSS/JS សុទ្ធ (PURE WEB) ---
          elif [ -f "index.html" ]; then
            echo "==> Pure HTML/JS Project Detected."
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            
            rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
            echo '{"appId": "com.myapp.app", "appName": "My App", "webDir": "."}' > capacitor.config.json
            
            npx cap add android || true
            npx cap sync android
            
            if [ -d "android" ]; then
              echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
              echo "android.useAndroidX=true" >> android/gradle.properties
              echo "android.enableJetifier=true" >> android/gradle.properties
            fi

            cd android
            chmod +x gradlew
            ./gradlew clean
            ./gradlew assembleRelease --no-daemon

          else
            echo "Error: Unknown project structure! Cannot find pubspec.yaml, package.json, or index.html"
            exit 1
          fi

      # 4. ប្រមូល File APK ដែលបាន Build រួច (ប្រមូលយកតែឯកសារ Release)
      - name: Collect Generated APKs
        run: |
          mkdir -p output_apks
          # ស្វែងរកតែ File ដែលមានពាក្យ "release" ដើម្បីការពារការច្រឡំ
          find . -type f -name "*release*.apk" -not -path "*/temp_extract/*" -exec cp {} output_apks/ \;
          echo "Found APK files:"
          ls -lh output_apks/

      # 5. Upload File APK ទុកឱ្យ Download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          # ប្តូរឈ្មោះ Artifact ឱ្យច្បាស់ដើម្បីស្រួលចំណាំ
          name: APP-RELEASE-FINAL
          path: output_apks/*.apk
