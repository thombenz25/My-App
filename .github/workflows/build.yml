name: Universal Multi-Framework Android APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# បន្ថែម Memory ជាសកលសម្រាប់ Java និង Gradle
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
  _JAVA_OPTIONS: "-Xmx4096m"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. ស្វែងរក និង Extract ZIP File ដោយស្វ័យប្រវត្តិ
      - name: Extract ZIP File (if present)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "ZIP file detected. Extracting..."
            unzip -o *.zip -d temp_extract
            TARGET_FILE=$(find temp_extract \( -name "pubspec.yaml" -o -name "package.json" -o -name "index.html" \) | head -n 1)
            if [ -n "$TARGET_FILE" ]; then
              PROJECT_DIR=$(dirname "$TARGET_FILE")
              cp -r "$PROJECT_DIR"/* .
              rm -rf temp_extract
            else
              cp -r temp_extract/* .
              rm -rf temp_extract
            fi
          fi

      # 2. ដំឡើង Environment ទាំងអស់ (Java 17, Node 20, Flutter, Package Managers)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Corepack & Bun
        run: |
          npm install -g corepack bun || true
          corepack enable || true

      # 3. ដំឡើង Android NDK & CMake សម្រាប់ Compile C++ Native Modules (ដូចជា expo-av)
      - name: Setup Android NDK & CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # 4. បង្កើត Global Gradle Configuration
      - name: Configure Gradle Memory & Settings
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=false" >> ~/.gradle/gradle.properties
          echo "android.ndkVersion=26.1.10909125" >> ~/.gradle/gradle.properties

      # 5. ពិនិត្យ និង Build តាមប្រភេទ Project ដោយស្វ័យប្រវត្តិ
      - name: Auto Detect Project and Build APK
        run: |
          echo "=========================================="
          echo "   Detecting Project Type & Building...   "
          echo "=========================================="
          
          # --- ករណីទី ១៖ FLUTTER PROJECT ---
          if [ -f "pubspec.yaml" ]; then
            echo "==> Flutter Project Detected."
            flutter pub get
            flutter build apk --debug

          # --- ករណីទី ២៖ NODE / REACT / REACT NATIVE PROJECT ---
          elif [ -f "package.json" ]; then
            echo "==> Node/React Project Detected."
            
            if [ -f "pnpm-lock.yaml" ]; then
              pnpm install --no-frozen-lockfile || npm install --legacy-peer-deps
            elif [ -f "yarn.lock" ]; then
              yarn install || npm install --legacy-peer-deps
            elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
              bun install || npm install --legacy-peer-deps
            else
              npm install --legacy-peer-deps
            fi

            # ប្រសិនបើជា React Native / Expo
            if grep -q '"react-native"' package.json || grep -q '"expo"' package.json; then
              echo "==> React Native / Expo Project Detected."
              if [ ! -d "android" ]; then
                echo "Generating Android native code..."
                npm install expo --legacy-peer-deps || true
                npx expo prebuild --platform android --clean || true
              fi

              if [ -d "android" ]; then
                echo "sdk.dir=$ANDROID_HOME" > android/local.properties
                echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> android/local.properties
                echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
                echo "android.enableJetifier=false" >> android/gradle.properties
                echo "android.ndkVersion=26.1.10909125" >> android/gradle.properties
              fi

              cd android
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon

            # ប្រសិនបើជា React Web / Vite / Vue / Next.js
            else
              echo "==> React/Web Project Detected. Converting Web to APK via Capacitor..."
              npm install @capacitor/core @capacitor/cli @capacitor/android typescript ts-node --legacy-peer-deps
              
              npm run build || npm run generate || true
              
              BUILD_DIR="dist"
              if [ -d "build" ]; then BUILD_DIR="build"; fi
              if [ -d "out" ]; then BUILD_DIR="out"; fi
              if [ -d "public" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then BUILD_DIR="public"; fi
              
              rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
              echo "{\"appId\": \"com.myapp.app\", \"appName\": \"My App\", \"webDir\": \"$BUILD_DIR\"}" > capacitor.config.json
              
              npx cap add android || true
              npx cap sync android
              
              if [ -d "android" ]; then
                echo "sdk.dir=$ANDROID_HOME" > android/local.properties
                echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> android/local.properties
                echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
                echo "android.enableJetifier=false" >> android/gradle.properties
                echo "android.ndkVersion=26.1.10909125" >> android/gradle.properties
              fi

              cd android
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon
            fi

          # --- ករណីទី ៣៖ HTML/CSS/JS សុទ្ធ (PURE WEB) ---
          elif [ -f "index.html" ]; then
            echo "==> Pure HTML/JS Project Detected."
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            
            rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
            echo '{"appId": "com.myapp.app", "appName": "My App", "webDir": "."}' > capacitor.config.json
            
            npx cap add android || true
            npx cap sync android
            
            if [ -d "android" ]; then
              echo "sdk.dir=$ANDROID_HOME" > android/local.properties
              echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> android/local.properties
              echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
              echo "android.enableJetifier=false" >> android/gradle.properties
              echo "android.ndkVersion=26.1.10909125" >> android/gradle.properties
            fi

            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon

          else
            echo "Error: Unknown project structure! Cannot find pubspec.yaml, package.json, or index.html"
            exit 1
          fi

      # 6. ប្រមូល File APK ដែលបាន Build រួច
      - name: Collect Generated APKs
        run: |
          mkdir -p output_apks
          find . -type f -name "*.apk" -not -path "*/temp_extract/*" -exec cp {} output_apks/ \;
          echo "Found APK files:"
          ls -lh output_apks/

      # 7. Upload File APK ទុកឱ្យ Download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output_apks/*.apk
